<!DOCTYPE html>
<html lang="nl">

<head>
  <title>NTRIP servers NL</title>

  <link rel="icon" type="image/x-icon" href="favicon.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>

<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script>
    // Initialize the map
    const map = L.map('map').setView([52.25, 5.64, 4.7], 8);

    // Create a marker cluster group
    var markers = L.markerClusterGroup({
      maxClusterRadius: 5,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      iconCreateFunction: function(cluster) {
        return L.divIcon({
          className: "transparent-div",
          html: '<img src="stream.png"/>',
          iconSize: [32, 32],
          iconAnchor: [16, 28]
        });
      }
    });

    // Add a tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '(c) OpenStreetMap contributors'
    }).addTo(map);

    // Fetch GeoJSON data and add to the map
    fetch('rtcm.geojson')
      .then(response => response.json())
      .then(data => {
        var geojsonLayer = L.geoJSON(data, {
          pointToLayer: createMarker,
          onEachFeature: createPopup
        });
        markers.addLayer(geojsonLayer);
        map.addLayer(markers);
      }).catch(error => console.error("Error loading GeoJSON:", error));

    const streamIcon = L.icon({
        iconUrl: 'stream.png',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

    function createMarker(feature, latlng) {
      return L.marker(latlng, { icon: streamIcon });
    }

    function network2color(network) {
      switch (network) {
        case 'NETPOS': return 'red';
        case 'AGRS.NL':
        case 'AGRS.BES': return 'green';
        case 'GNSS.NL': return 'blue';
        default: return 'black';
      }
    }

    function createPopup(feature, layer) {
      if (feature.properties) {
        var props = new Map(Object.entries(feature.properties));
        const mountpoint = props.get('Mountpoint') || "";
        props.delete('Mountpoint');
        const description = props.get('Identifier / Description') || '';
        props.delete('Identifier / Description');
        let popupContent = `<b>${mountpoint} (${description}):</b><ul>`;
        for (const key in feature.properties) {
          const value = feature.properties[key];
          if (value) {
            popupContent += `<li><b>${key}</b>: ${feature.properties[key]}</li>`;
          }
        }
        popupContent += '</ul>';
        layer.bindPopup(popupContent);
      }
    }
  </script>
</body>

</html>
